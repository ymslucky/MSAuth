# Quality gate for every push and PR: schema freshness, tests, types, build.
# Deploys are triggered separately by Cloudflare Workers Builds — this job is
# the gate that must be green first (AGENTS.md: commit only on a green suite).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Schema drift check (regenerate and diff)
        run: |
          npm run db:schema
          git diff --exit-code migrations/0001_schema.sql
      - name: Unit and integration tests (workerd)
        run: npm test
      - name: Types, SPA build, deploy dry-run
        run: npm run check
